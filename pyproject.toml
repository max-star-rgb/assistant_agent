[project]
name = "assistant_agent"
version = "0.1.0"
description = "A local-first multimodal autonomous tool-calling assistant agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "aiosqlite>=0.22.1,<1",
    "langchain==1.3.15",
    "langchain-core>=1.5.4,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langchain-openai>=1.4.3,<2",
    "langgraph>=1.2.4,<2",
    "langgraph-checkpoint>=4.1.1,<5",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "langgraph-sdk>=0.4.2,<0.5",
    "openai>=2.0",
    "pydantic>=2.0",
    "tqdm>=4.66,<5",
    "tokenizers>=0.20,<1",
    "uvicorn>=0.30.0",
    "websockets>=15.0,<16",
]

[project.optional-dependencies]
browser = ["playwright>=1.62,<2"]
dev = ["pytest>=8.0"]
eval = ["langsmith>=0.9.8,<1", "PyYAML>=6.0,<7"]
local-vision-embedding = [
    "numpy>=2.0,<3",
    "onnx>=1.17,<2",
    "Pillow>=10,<12",
    "onnxruntime-gpu>=1.21,<1.27",
]
visual-memory-search = [
    "fastembed>=0.8,<1",
]
memory-langmem = [
    "langmem>=0.0.30,<0.1",
    "httpx[socks]>=0.28,<0.29",
]
agent-server-dev = [
    "langgraph-cli[inmem]>=0.4.30,<0.5",
    "langgraph-runtime-inmem==0.32.4",
    "wheel>=0.46,<1",
]
google-workspace-mcp = [
    "PySocks>=1.7,<2",
    "workspace-mcp==1.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]
markers = [
    "core_invariant(id): stable core-framework invariant identifier",
    "playwright_smoke: controlled local Chromium integration test",
]
