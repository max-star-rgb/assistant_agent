[project]
name = "assistant_agent"
version = "0.1.0"
description = "A local-first multimodal autonomous tool-calling assistant agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0", "openai>=2.0", "pydantic>=2.0", "uvicorn>=0.30.0"]

[project.optional-dependencies]
dev = ["httpx2>=0.0.1", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
