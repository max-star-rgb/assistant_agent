[project]
name = "assistant_agent"
version = "0.1.0"
description = "A local-first multimodal autonomous tool-calling assistant agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "mcp>=1.27,<2",
    "openai>=2.0",
    "pydantic>=2.0",
    "uvicorn>=0.30.0",
    "websockets>=15.0,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
observability = [
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
