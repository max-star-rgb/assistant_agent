[project]
name = "assistant_agent"
version = "0.1.0"
description = "A local-first multimodal autonomous tool-calling assistant agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "mcp>=1.27,<2",
    "openai>=2.0",
    "pydantic>=2.0",
    "tqdm>=4.66,<5",
    "tokenizers>=0.20,<1",
    "uvicorn>=0.30.0",
    "websockets>=15.0,<16",
]

[project.optional-dependencies]
browser = ["playwright>=1.62,<2"]
dev = ["pytest>=8.0"]
eval = ["langfuse>=4.10,<5", "langsmith>=0.9.8,<1", "PyYAML>=6.0,<7"]
observability = [
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]
local-vision-embedding = [
    "numpy>=2.0,<3",
    "onnx>=1.17,<2",
    "Pillow>=10,<12",
    "onnxruntime-gpu>=1.21,<1.27",
]
visual-memory-search = [
    "fastembed>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]
markers = [
    "core_invariant(id): stable core-framework invariant identifier",
    "playwright_smoke: controlled local Chromium integration test",
]
