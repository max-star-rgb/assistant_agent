  "tests/test_agent_runtime*.py",
  "tests/test_assistant_*.py",
  "tests/test_graph*.py",
  "tests/test_langgraph*.py",
  "tests/test_agent_*routing*.py",
]

[[scope]]
name = "memory"
source_paths = [
  "src/assistant_agent/memory/**",
  "src/assistant_agent/tools/memory_*.py",
  "src/assistant_agent/services/memory_*.py",
  "src/assistant_agent/schemas/memory*.py",
]
test_paths = [
  "tests/test_memory*.py",
  "tests/test_framework_memory_store.py",
  "tests/test_explicit_memory_e2e.py",
]

[[scope]]
name = "providers"
source_paths = [
  "src/assistant_agent/providers/**",
  "src/assistant_agent/services/provider_*.py",
  "src/assistant_agent/config.py",
  "src/assistant_agent/runtime_profile.py",
]
test_paths = [
  "tests/test_provider*.py",
  "tests/test_runtime_profile*.py",
  "tests/test_qwen*.py",
  "tests/test_ark*.py",
]

[[scope]]
name = "api"
source_paths = [
  "src/assistant_agent/api/**",
