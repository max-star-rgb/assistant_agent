schema_version = 1
coverage = "complete"

[[domains]]
id = "agent-server"
authority = "docs/gateway-architecture.md"
read_when = [
  "Agent Server、thread、run、cancel、reconnect、checkpoint、Store 或部署生命周期",
  "custom route、认证、公开 SDK 或媒体入口到 Graph 的映射",
]
source_globs = [
  "langgraph.json",
  "src/assistant_agent/agent_server/**",
  "src/assistant_agent/proactive_delivery.py",
  "scripts/run_server.py",
  "scripts/agent_cli.py",
  "tests/core/contract/test_gateway_contract.py",
  "tests/tdd/native-agent-parent-graph/test_agent_server_factory.py",
  "tests/tdd/native-agent-parent-graph/test_media_native_adapter.py",
  "tests/tdd/native-proactive-delivery/test_native_dispatch.py",
  "tests/tdd/native-proactive-delivery/test_media_delivery_pump.py",
]
thin_references = ["README.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/contract/test_gateway_contract.py tests/tdd/native-agent-parent-graph/test_agent_server_factory.py tests/tdd/native-agent-parent-graph/test_media_native_adapter.py tests/tdd/native-proactive-delivery/test_native_dispatch.py tests/tdd/native-proactive-delivery/test_media_delivery_pump.py",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/agent_cli.py --help",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "media-agent-protocol"
authority = "docs/media-agent-service-websocket.md"
read_when = [
  "Media-Agent WebSocket、assistantControl、chat/audio/video/interrupt wire contract",
  "图片交付、3D submit/callback、H.264 或媒体联调",
]
source_globs = [
  "src/assistant_agent/agent_server/media_app.py",
  "src/assistant_agent/agent_server/media_protocol.py",
  "src/assistant_agent/agent_server/media_session.py",
  "src/assistant_agent/api/rendering_3d_callback.py",
  "src/assistant_agent/media/artifact_delivery.py",
  "src/assistant_agent/media/generated_artifacts.py",
  "src/assistant_agent/media/video/**",
  "scripts/media_simulator.py",
]
thin_references = ["README.md", "docs/gateway-architecture.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/media_simulator.py --help",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "runtime-event-stream"
authority = "docs/runtime-event-stream-architecture.md"
read_when = [
  "AssistantRootGraph、fast create_agent、planning StateGraph 或原生 state channel",
  "LangGraph stream、interrupt/resume、checkpoint、主动投递 dispatch 或 terminal messages",
]
source_globs = [
  "src/assistant_agent/native_agent/root_graph.py",
  "src/assistant_agent/native_agent/fast_agent.py",
  "src/assistant_agent/native_agent/planning_graph.py",
  "src/assistant_agent/native_agent/state.py",
  "src/assistant_agent/native_agent/models.py",
  "src/assistant_agent/proactive_delivery.py",
  "tests/tdd/native-proactive-delivery/test_native_dispatch.py",
]
thin_references = ["README.md", "docs/gateway-architecture.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/integration/test_runtime_lifecycle.py",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/native-agent-parent-graph",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/native-proactive-delivery/test_native_dispatch.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "tool-calling"
authority = "docs/tool-calling-architecture.md"
