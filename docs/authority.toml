schema_version = 1
coverage = "complete"

[[domains]]
id = "documentation-index"
authority = "docs/README.md"
read_when = [
  "开始仓库工程任务并选择需要读取的专项 authority",
  "新增、删除、重命名或重新归类当前文档",
]
source_globs = [
  "AGENTS.md",
  "README.md",
  "docs/README.md",
  "docs/authority.toml",
]
thin_references = ["AGENTS.md", "README.md"]
verification = [
  "python scripts/check_documentation_authority.py --repo-root .",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "agent-server"
authority = "docs/agent-server-architecture.md"
read_when = [
  "Agent Server、thread、run、cancel、reconnect、checkpoint、Store 或部署生命周期",
  "custom route、认证、公开 SDK 或媒体入口到 Graph 的映射",
  "本地安装、依赖约束、模型准备或数据迁移",
]
source_globs = [
  "langgraph.json",
  "src/assistant_agent/agent_server/**",
  "integrations/qwen_audio_agent/**",
  "src/assistant_agent/client.py",
  "src/assistant_agent/runtime/thread_resources.py",
  "src/assistant_agent/proactive_delivery.py",
  "scripts/run_server.py",
  "scripts/agent_cli.py",
  "requirements.txt",
  "scripts/setup_local.py",
  "config/**",
  ".gitignore",
  ".gitattributes",
]
thin_references = ["README.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/agent_cli.py --help",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "media-agent-protocol"
authority = "docs/media-agent-service-websocket.md"
read_when = [
  "Media-Agent WebSocket、assistantControl、chat/audio/video/interrupt wire contract",
  "图片交付、3D submit/callback、H.264 或媒体联调",
]
source_globs = [
  "src/assistant_agent/agent_server/media_app.py",
  "src/assistant_agent/agent_server/media_protocol.py",
  "src/assistant_agent/agent_server/media_session.py",
  "src/assistant_agent/agent_server/rendering_3d_callback.py",
  "src/assistant_agent/media/artifact_delivery.py",
  "src/assistant_agent/media/generated_artifacts.py",
  "src/assistant_agent/media/image_to_3d.py",
  "src/assistant_agent/media/image_to_3d_jobs.py",
  "scripts/media_simulator.py",
]
thin_references = ["README.md", "docs/agent-server-architecture.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/media_simulator.py --help",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "runtime-event-stream"
authority = "docs/runtime-event-stream-architecture.md"
read_when = [
  "统一 AssistantAgent、Memory lifecycle middleware、Deep Agents task、只读 worker 或原生 state channel",
  "LangGraph stream、interrupt/resume、checkpoint 或 terminal messages",
  "主 Agent 原生 ChatModel、DashScope Provider adapter 或模型调用 wire",
]
source_globs = [
  "src/assistant_agent/native_agent/assistant_agent.py",
  "src/assistant_agent/providers/realtime_session.py",
  "src/assistant_agent/native_agent/memory_middleware.py",
  "src/assistant_agent/native_agent/state.py",
  "src/assistant_agent/native_agent/search_profiles.py",
  "src/assistant_agent/providers/dashscope_langchain.py",
  "src/assistant_agent/identity.py",
  "src/assistant_agent/runtime/__init__.py",
  "src/assistant_agent/runtime/local_backend.py",
  "src/assistant_agent/runtime/thread_resources.py",
]
thin_references = ["README.md", "docs/agent-server-architecture.md"]
verification = [
  "python -m compileall -q src/assistant_agent/native_agent",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "tool-calling"
authority = "docs/tool-calling-architecture.md"
read_when = [
  "Tool、Tool schema、catalog、exposure、ToolNode 或 ToolRuntime",
  "Plugin、MCP、durable task Tool 接入、Provider-native 能力或副作用治理",
]
source_globs = [
  ".env.example",
  "src/assistant_agent/config/**",
  "src/assistant_agent/native_agent/assistant_agent.py",
  "src/assistant_agent/native_agent/providers.py",
  "src/assistant_agent/native_agent/tool_profiles.py",
  "src/assistant_agent/native_agent/unknown_tool_feedback.py",
  "src/assistant_agent/native_agent/tools.py",
  "src/assistant_agent/runtime/local_backend.py",
  "src/assistant_agent/runtime/thread_resources.py",
  "src/assistant_agent/skills/**",
  "src/assistant_agent/runtime/device_backend.py",
  "src/assistant_agent/runtime/device_client.py",
  "src/assistant_agent/runtime/device_files.py",
  "src/assistant_agent/tools/**",
  "src/assistant_agent/mcp/**",
  "skills/**",
]
thin_references = ["README.md", "scripts/README.md"]
verification = [
  "python -m compileall -q src/assistant_agent/tools src/assistant_agent/mcp",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "durable-tasks"
authority = "docs/durable-task-architecture.md"
read_when = [
  "durable task 状态机、schedule、resume、lease、checkpoint 或 background worker",
  "TaskPlan、TaskStep、TaskStore、hotel price watch 或 durable failure atomicity",
]
source_globs = [
  "src/assistant_agent/automation/durable_tasks/**",
]
thin_references = ["docs/tool-calling-architecture.md", "tests/README.md"]
verification = [
  "python -m compileall -q src/assistant_agent/automation/durable_tasks",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "graph-memory"
authority = "docs/memory-service-architecture.md"
read_when = [
  "LangGraph 长期记忆节点、memory_context、冻结快照或 commit ledger",
  "记忆读取、写入、time-travel、Mem0/LangMem/disabled 后端装配",
]
source_globs = [
  "src/assistant_agent/native_agent/memory.py",
  "src/assistant_agent/agent_server/embeddings.py",
  "src/assistant_agent/native_agent/memory_graph.py",
  "src/assistant_agent/native_agent/memory_middleware.py",
  "src/assistant_agent/native_agent/state.py",
  "src/assistant_agent/memory/**",
]
thin_references = ["README.md", "docs/context_engineering_status.md", "scripts/README.md"]
verification = [
  "python -m compileall -q src/assistant_agent/native_agent/memory.py src/assistant_agent/memory",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "memory-server-api"
authority = "docs/memory_server_api_spec.md"
read_when = [
  "Mem0 graph backend 私有 HTTP adapter 或 OSS REST 子集",
  "Mem0Client request/response、身份 filter 或错误语义",
  "远端视觉 Memory Service upload、task status 或 query wire",
]
source_globs = [
  "src/assistant_agent/memory/mem0/**",
  "src/assistant_agent/memory/remote_service.py",
]
thin_references = ["README.md", "docs/memory-service-architecture.md"]
verification = [
  "python -m compileall -q src/assistant_agent/memory/mem0 src/assistant_agent/memory/remote_service.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "context-engineering"
authority = "docs/context_engineering_status.md"
read_when = [
  "context、prompt、conversation history、context budget 或 compaction",
  "AssistantRunContext、请求上下文编译或 Tool observation",
]
source_globs = [
  "src/assistant_agent/native_agent/assistant_prompt.py",
  "src/assistant_agent/native_agent/prompts/**",
  "src/assistant_agent/native_agent/context.py",
  "src/assistant_agent/native_agent/token_counter.py",
  "src/assistant_agent/native_agent/assistant_agent.py",
  "src/assistant_agent/native_agent/state.py",
  "src/assistant_agent/native_agent/user_context.py",
]
thin_references = ["README.md", "docs/runtime-event-stream-architecture.md"]
verification = [
  "python -m compileall -q src/assistant_agent/native_agent/context.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "visual-perception"
authority = "docs/visual-perception-architecture.md"
read_when = [
  "实时视觉、SigLIP2 latest-wins、并行关键帧 VLM、逻辑关键帧窗口或目标帧屏障",
  "SigLIP2、image/text embedding、semantic keyframe 或视觉提醒",
  "短期视觉时间线、visual_memory_search、Qdrant 或历史找物",
]
source_globs = [
  "src/assistant_agent/media/embedding/**",
  "src/assistant_agent/media/proactive_messages.py",
  "src/assistant_agent/media/runtime_media.py",
  "src/assistant_agent/media/vision/__init__.py",
  "src/assistant_agent/media/vision/ark_adapter.py",
  "src/assistant_agent/media/vision/models.py",
  "src/assistant_agent/media/vision/provider_selection.py",
  "src/assistant_agent/media/vision/real_vision_adapter.py",
  "src/assistant_agent/media/vision/vision_adapter.py",
  "src/assistant_agent/media/vision/vision_client.py",
  "src/assistant_agent/media/visual_perception/**",
  "src/assistant_agent/media/video/**",
]
thin_references = ["README.md", "docs/media-agent-service-websocket.md"]
verification = [
  "python -m compileall -q src/assistant_agent/media/visual_perception src/assistant_agent/media/embedding",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "runtime-observability"
authority = "docs/observability-harness.md"
read_when = [
  "trace、observability 或 LangSmith native tracing",
  "trace lifecycle、原生 Graph evaluation target 或真实评测边界",
]
source_globs = [
  "src/assistant_agent/providers/realtime_trace.py",
  "src/assistant_agent/evaluation/**",
  "src/assistant_agent/agent_server/services.py",
  "src/assistant_agent/native_agent/assistant_agent.py",
  "src/assistant_agent/media/vision/observability.py",
]
thin_references = ["scripts/README.md"]
verification = [
  "python -m compileall -q src/assistant_agent/agent_server/services.py src/assistant_agent/native_agent/assistant_agent.py src/assistant_agent/media/vision/observability.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "observability-diagnosis"
authority = "docs/observability-diagnosis-runbook.md"
read_when = [
  "用户提供精确 LangSmith run_id、trace_id 或 thread_id，要求定位、打开、追踪或讨论",
  "诊断真实测试、真实通话、真实 run、trace 或机器日志",
  "用户提供 assistant.turn trace_id 或询问一次运行为何失败",
]
source_globs = [
  "docs/observability-diagnosis-runbook.md",
]
thin_references = ["AGENTS.md", "docs/observability-harness.md"]
verification = [
  "python -c 'from langsmith import Client; assert callable(Client.read_run) and callable(Client.list_runs)'",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "test-policy"
authority = "tests/README.md"
read_when = [
  "新增或修改 pytest、选择临时 TDD 目录",
  "判断验证范围、临时测试 或汇报测试决策",
]
source_globs = [
  "tests/README.md",
  "pyproject.toml",
]
thin_references = ["AGENTS.md"]
verification = [
  "python scripts/check_documentation_authority.py --repo-root .",
]
exclusive_literals = []
exclusive_allowlist = []
