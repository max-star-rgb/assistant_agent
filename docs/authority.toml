schema_version = 1
coverage = "complete"

[[domains]]
id = "agent-server"
authority = "docs/gateway-architecture.md"
read_when = [
  "Agent Server、thread、run、cancel、reconnect、checkpoint、Store 或部署生命周期",
  "custom route、认证、公开 SDK 或媒体入口到 Graph 的映射",
]
source_globs = [
  "langgraph.json",
  "src/assistant_agent/agent_server/**",
  "scripts/run_server.py",
  "scripts/agent_cli.py",
  "tests/core/contract/test_gateway_contract.py",
  "tests/tdd/agent_server_native_runtime/**",
]
thin_references = ["README.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/contract/test_gateway_contract.py tests/tdd/agent_server_native_runtime",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/agent_cli.py --help",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "media-agent-protocol"
authority = "docs/media-agent-service-websocket.md"
read_when = [
  "Media-Agent WebSocket、assistantControl、chat/audio/video/interrupt wire contract",
  "图片交付、3D submit/callback、H.264 或媒体联调",
]
source_globs = [
  "src/assistant_agent/agent_server/media_app.py",
  "src/assistant_agent/agent_server/media_protocol.py",
  "src/assistant_agent/agent_server/media_session.py",
  "src/assistant_agent/api/rendering_3d_callback.py",
  "src/assistant_agent/gateway/artifact_delivery.py",
  "src/assistant_agent/media/video/**",
  "scripts/media_simulator.py",
]
thin_references = ["README.md", "docs/gateway-architecture.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/media_simulator.py --help",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "runtime-event-stream"
authority = "docs/runtime-event-stream-architecture.md"
read_when = [
  "assistant loop、AgentGraphRuntime、AgentEvent 或 AgentRunStream",
  "Provider stream、LLMEvent、thread bridge、取消或 terminal result",
]
source_globs = [
  "src/assistant_agent/runtime/**",
  "src/assistant_agent/providers/llm_events.py",
  "src/assistant_agent/gateway/runtime_event_mapping.py",
]
thin_references = ["README.md", "docs/gateway-architecture.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "tool-calling"
authority = "docs/tool-calling-architecture.md"
read_when = [
  "Tool、ToolSpec、catalog、exposure、ActionValidator、ToolExecutor 或 ToolRegistry",
  "Plugin、MCP、durable workflow、Provider-native 能力或副作用治理",
]
source_globs = [
  "src/assistant_agent/tools/**",
  "src/assistant_agent/mcp/**",
  "src/assistant_agent/workflows/**",
  "src/assistant_agent/automation/durable_tasks/**",
  "src/assistant_agent/runtime/action_validator.py",
  "src/assistant_agent/runtime/tool_execution_backend.py",
  "src/assistant_agent/runtime/tool_executor.py",
]
thin_references = ["README.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/contract/test_tool_contract.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "graph-memory"
authority = "docs/memory-service-architecture.md"
read_when = [
  "LangGraph 长期记忆节点、memory_context、冻结快照或 commit ledger",
  "记忆读取、写入、time-travel、Mem0/LangMem/disabled 后端装配",
]
source_globs = [
  "src/assistant_agent/memory/**",
  "src/assistant_agent/runtime/assistant_graph_state.py",
  "src/assistant_agent/runtime/assistant_loop_graph.py",
  "src/assistant_agent/runtime/assistant_graph_app.py",
  "tests/core/integration/test_memory_lifecycle.py",
]
thin_references = ["README.md", "docs/context_engineering_status.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/integration/test_memory_lifecycle.py",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/langgraph-memory-nodes",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "memory-server-api"
authority = "docs/memory_server_api_spec.md"
read_when = [
  "Mem0 graph backend 私有 HTTP adapter 或 OSS REST 子集",
  "Mem0Client request/response、身份 filter 或错误语义",
]
source_globs = [
  "src/assistant_agent/memory/mem0/**",
]
thin_references = ["README.md", "docs/memory-service-architecture.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/langgraph-memory-nodes/test_mem0_nodes.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "context-engineering"
authority = "docs/context_engineering_status.md"
read_when = [
  "context、prompt、conversation history、context budget 或 compaction",
  "AssistantContextPack、ChatRequest 编译、Tool observation 或 context report",
]
source_globs = [
  "src/assistant_agent/context/**",
  "src/assistant_agent/runtime/system_prompt_policy.py",
]
thin_references = ["README.md", "docs/runtime-event-stream-architecture.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/integration/test_context_lifecycle.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "multimodal-embedding"
authority = "docs/multimodal-embedding-architecture.md"
read_when = [
  "SigLIP2、image/text embedding、semantic keyframe 或视觉提醒",
  "短期视觉时间线、visual_memory_search、Qdrant 或历史找物",
]
source_globs = [
  "src/assistant_agent/media/embedding/**",
  "src/assistant_agent/media/video/**",
  "src/assistant_agent/tools/plugins/builtin/media_inspection/**",
  "scripts/run_system_multimodal_embedding_eval.py",
]
thin_references = ["README.md", "docs/media-agent-service-websocket.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/unified-siglip2 tests/tdd/qdrant-visual-memory-search",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "agent-communication"
authority = "docs/agent-communication-routing.md"
read_when = [
  "multi-agent、AgentRouter、delegation、agent directory 或 control plane",
  "A2A、JSON-RPC、跨实例 session、transport 或 pilot readiness",
]
source_globs = [
  "src/assistant_agent/multi_agent/**",
]
thin_references = ["README.md", "scripts/README.md"]
verification = [
  "python -m compileall -q src/assistant_agent/multi_agent",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "runtime-observability"
authority = "docs/observability-harness.md"
read_when = [
  "trace、observability、OTel、Langfuse 或 LangSmith 投影",
  "runtime audit、Live Observation Rule 或日常评分",
]
source_globs = [
  "src/assistant_agent/observability/**",
  "scripts/run_runtime_audit.py",
  "deploy/systemd/user/assistant-agent-runtime-audit.*",
  "tests/tdd/runtime_audit/**",
]
thin_references = ["scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/runtime_audit",
  "python scripts/run_runtime_audit.py configure-evaluators --model-provider qwen-judge --model qwen-flash",
]
exclusive_literals = [
  "assistant-agent-runtime-audit.service",
]
exclusive_allowlist = []

[[domains]]
id = "observability-diagnosis"
authority = "docs/observability-diagnosis-runbook.md"
read_when = [
  "诊断真实测试、真实通话、真实 run、trace 或机器日志",
  "用户提供 assistant.turn trace_id 或询问一次运行为何失败",
]
source_globs = [
  "src/assistant_agent/observability/trace_query.py",
  "src/assistant_agent/observability/trace_store.py",
  "src/assistant_agent/observability/trajectory_debug.py",
  "src/assistant_agent/observability/agent_service_delivery.py",
  "src/assistant_agent/observability/agent_service_latency.py",
]
thin_references = ["AGENTS.md", "docs/observability-harness.md"]
verification = [
  "python -c 'from assistant_agent.observability.trace_query import TraceQueryService'",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "test-policy"
authority = "tests/README.md"
read_when = [
  "新增或修改 pytest、选择 core/TDD/incubating 目录",
  "判断验证范围、core invariant 或汇报测试决策",
]
source_globs = [
  "tests/core/**",
  "tests/tdd/**",
  "pyproject.toml",
]
thin_references = ["AGENTS.md", ".codex/skills/assistant-agent-development-testing/SKILL.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/unit/test_test_policy.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "release-review-eval"
authority = "evals/README.md"
read_when = [
  "system eval 或上线前 Release Review",
  "Langfuse/LangSmith Dataset、Experiment、Release Review webhook 或 Score/Feedback 完整性",
]
source_globs = [
  "evals/release_review/**",
  "evals/runtime_regression/**",
  "evals/langsmith_runtime_regression/**",
  "evals/langsmith_workflow_regression/**",
  "evals/system/**",
  "src/assistant_agent/evaluation/**",
  "scripts/run_release_review.py",
  "scripts/run_runtime_regressions.py",
  "scripts/run_langsmith_runtime_regressions.py",
  "scripts/run_langsmith_workflow_regressions.py",
  "deploy/langfuse_eval_webhook/**",
  "tests/tdd/release-review-native-experiment/**",
  "tests/tdd/runtime-eval-feedback-loop/**",
  "tests/tdd/langsmith-parallel-evaluation/**",
]
thin_references = [
  "docs/observability-harness.md",
  "scripts/README.md",
]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/native-langgraph-m5/test_langsmith_equivalence_gate.py",
  "python scripts/run_release_review.py --inspect",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/runtime-eval-feedback-loop",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/langsmith-parallel-evaluation",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/native-langgraph-m3/test_langsmith_workflow_experiment.py",
]
exclusive_literals = [
  "ASSISTANT_AGENT_LANGFUSE_RELEASE_REVIEW_SIGNING_SECRET",
  "ASSISTANT_AGENT_LANGFUSE_RUNTIME_REGRESSION_SIGNING_SECRET",
]
exclusive_allowlist = []
