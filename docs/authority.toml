schema_version = 1
coverage = "complete"

[[domains]]
id = "documentation-index"
authority = "docs/README.md"
read_when = [
  "开始仓库工程任务并选择需要读取的专项 authority",
  "新增、删除、重命名或重新归类当前文档",
]
source_globs = [
  "AGENTS.md",
  "README.md",
  "docs/README.md",
  "docs/authority.toml",
]
thin_references = ["AGENTS.md", "README.md"]
verification = [
  "python scripts/check_documentation_authority.py --repo-root .",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "agent-server"
authority = "docs/agent-server-architecture.md"
read_when = [
  "Agent Server、thread、run、cancel、reconnect、checkpoint、Store 或部署生命周期",
  "custom route、认证、公开 SDK 或媒体入口到 Graph 的映射",
]
source_globs = [
  "langgraph.json",
  "src/assistant_agent/agent_server/**",
  "src/assistant_agent/coding/config.py",
  "src/assistant_agent/coding/artifacts.py",
  "src/assistant_agent/coding/artifact_egress.py",
  "src/assistant_agent/coding/credentials.py",
  "src/assistant_agent/coding/dependencies.py",
  "src/assistant_agent/coding/dependency_egress.py",
  "src/assistant_agent/coding/integration.py",
  "src/assistant_agent/coding/repair.py",
  "src/assistant_agent/coding/sandbox.py",
  "src/assistant_agent/coding/sandbox_runner.py",
  "src/assistant_agent/coding/validation.py",
  "src/assistant_agent/coding/workspace.py",
  "src/assistant_agent/proactive_delivery.py",
  "patches/langgraph-runtime-inmem/**",
  "scripts/install_patched_inmem_runtime.py",
  "scripts/run_server.py",
  "scripts/agent_cli.py",
  "tests/core/contract/test_gateway_contract.py",
  "tests/core/integration/test_runtime_lifecycle.py",
]
thin_references = ["README.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/contract/test_gateway_contract.py tests/core/integration/test_runtime_lifecycle.py",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/ai-coding-validation",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/ai-coding-integration",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/ai-coding-sandbox",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/ai-coding-artifact-governance",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/agent-server-inmem-wakeup",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/agent_cli.py --help",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "media-agent-protocol"
authority = "docs/media-agent-service-websocket.md"
read_when = [
  "Media-Agent WebSocket、assistantControl、chat/audio/video/interrupt wire contract",
  "图片交付、3D submit/callback、H.264 或媒体联调",
]
source_globs = [
  "src/assistant_agent/agent_server/media_app.py",
  "src/assistant_agent/agent_server/media_protocol.py",
  "src/assistant_agent/agent_server/media_session.py",
  "src/assistant_agent/api/rendering_3d_callback.py",
  "src/assistant_agent/media/artifact_delivery.py",
  "src/assistant_agent/media/generated_artifacts.py",
  "src/assistant_agent/media/video/**",
  "scripts/media_simulator.py",
]
thin_references = ["README.md", "docs/agent-server-architecture.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/media_simulator.py --help",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "runtime-event-stream"
authority = "docs/runtime-event-stream-architecture.md"
read_when = [
  "AssistantRootGraph、fast/planning create_agent、Deep Agents task 或原生 state channel",
  "LangGraph stream、interrupt/resume、checkpoint 或 terminal messages",
]
source_globs = [
  "src/assistant_agent/native_agent/root_graph.py",
  "src/assistant_agent/native_agent/fast_agent.py",
  "src/assistant_agent/native_agent/planning_agent.py",
  "src/assistant_agent/native_agent/state.py",
  "src/assistant_agent/native_agent/models.py",
  "src/assistant_agent/native_agent/coding_graph.py",
  "src/assistant_agent/native_agent/coding_phase.py",
  "src/assistant_agent/coding/analysis.py",
  "src/assistant_agent/coding/inspect_recovery.py",
  "src/assistant_agent/coding/models.py",
  "src/assistant_agent/coding/review.py",
  "src/assistant_agent/coding/review_repair.py",
]
thin_references = ["README.md", "docs/agent-server-architecture.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/integration/test_runtime_lifecycle.py",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/native-deepagents-planning",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "tool-calling"
authority = "docs/tool-calling-architecture.md"
read_when = [
  "Tool、Tool schema、catalog、exposure、ToolNode 或 ToolRuntime",
  "Plugin、MCP、durable task、Provider-native 能力或副作用治理",
]
source_globs = [
  ".env.example",
  "src/assistant_agent/config/**",
  "src/assistant_agent/native_agent/providers.py",
  "src/assistant_agent/native_agent/tool_profiles.py",
  "src/assistant_agent/native_agent/tools.py",
  "src/assistant_agent/skills/**",
  "src/assistant_agent/tools/**",
  "src/assistant_agent/improvement/evaluator.py",
  "src/assistant_agent/coding/tools.py",
  "src/assistant_agent/coding/policy.py",
  "src/assistant_agent/coding/patches.py",
  "src/assistant_agent/mcp/**",
  "src/assistant_agent/automation/durable_tasks/**",
  "skills/**",
]
thin_references = ["README.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/contract/test_tool_contract.py",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/contract/test_extension_contract.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "graph-memory"
authority = "docs/memory-service-architecture.md"
read_when = [
  "LangGraph 长期记忆节点、memory_context、冻结快照或 commit ledger",
  "记忆读取、写入、time-travel、Mem0/LangMem/disabled 后端装配",
]
source_globs = [
  "src/assistant_agent/native_agent/memory.py",
  "src/assistant_agent/native_agent/memory_graph.py",
  "src/assistant_agent/native_agent/root_graph.py",
  "src/assistant_agent/native_agent/state.py",
  "src/assistant_agent/memory/**",
  "tests/core/integration/test_memory_lifecycle.py",
]
thin_references = ["README.md", "docs/context_engineering_status.md", "scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/integration/test_memory_lifecycle.py",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/native-memory-service/test_delayed_extraction.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "memory-server-api"
authority = "docs/memory_server_api_spec.md"
read_when = [
  "Mem0 graph backend 私有 HTTP adapter 或 OSS REST 子集",
  "Mem0Client request/response、身份 filter 或错误语义",
  "远端视觉 Memory Service upload、task status 或 query wire",
]
source_globs = [
  "src/assistant_agent/memory/mem0/**",
  "src/assistant_agent/memory/remote_service.py",
]
thin_references = ["README.md", "docs/memory-service-architecture.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/langgraph-memory-nodes/test_mem0_nodes.py",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/remote-visual-memory",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "context-engineering"
authority = "docs/context_engineering_status.md"
read_when = [
  "context、prompt、conversation history、context budget 或 compaction",
  "AssistantContextPack、ChatRequest 编译、Tool observation 或 context report",
]
source_globs = [
  "src/assistant_agent/native_agent/assistant_prompt.py",
  "src/assistant_agent/native_agent/context.py",
  "src/assistant_agent/native_agent/fast_agent.py",
  "src/assistant_agent/native_agent/planning_agent.py",
  "src/assistant_agent/native_agent/state.py",
  "src/assistant_agent/native_agent/user_context.py",
  "src/assistant_agent/context/**",
  "src/assistant_agent/runtime/system_prompt_policy.py",
]
thin_references = ["README.md", "docs/runtime-event-stream-architecture.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/integration/test_context_lifecycle.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "visual-perception"
authority = "docs/visual-perception-architecture.md"
read_when = [
  "实时视觉、SigLIP2 latest-wins、并行关键帧 VLM、逻辑关键帧窗口或目标帧屏障",
  "SigLIP2、image/text embedding、semantic keyframe 或视觉提醒",
  "短期视觉时间线、visual_memory_search、Qdrant 或历史找物",
]
source_globs = [
  "src/assistant_agent/media/embedding/**",
  "src/assistant_agent/media/visual_perception/**",
  "src/assistant_agent/media/video/**",
  "src/assistant_agent/tools/plugins/builtin/media_inspection/**",
  "scripts/run_system_multimodal_embedding_eval.py",
]
thin_references = ["README.md", "docs/media-agent-service-websocket.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/realtime-visual-target-window",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/run_system_realtime_visual_target_window_eval.py --dry-run",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/run_system_multimodal_embedding_eval.py --dry-run",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "agent-communication"
authority = "docs/agent-communication-routing.md"
read_when = [
  "multi-agent、AgentRouter、delegation、agent directory 或 control plane",
  "A2A、JSON-RPC、跨实例 session、transport 或 pilot readiness",
]
source_globs = [
  "src/assistant_agent/multi_agent/**",
]
thin_references = ["README.md", "scripts/README.md"]
verification = [
  "python -m compileall -q src/assistant_agent/multi_agent",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "runtime-observability"
authority = "docs/observability-harness.md"
read_when = [
  "trace、observability、canonical ledger 或 LangSmith native tracing",
  "canonical event、trace lifecycle 或日常异常 trace 沉淀",
]
source_globs = [
  "src/assistant_agent/observability/**",
]
thin_references = ["scripts/README.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/contract/test_observability_contract.py",
  "python -m compileall -q src/assistant_agent/observability",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "observability-diagnosis"
authority = "docs/observability-diagnosis-runbook.md"
read_when = [
  "用户提供精确 LangSmith run_id 或 trace_id，要求定位、打开、追踪或讨论",
  "诊断真实测试、真实通话、真实 run、trace 或机器日志",
  "用户提供 assistant.turn trace_id 或询问一次运行为何失败",
]
source_globs = [
  "src/assistant_agent/observability/trace_query.py",
  "src/assistant_agent/observability/trace_store.py",
  "src/assistant_agent/observability/trajectory_debug.py",
  "src/assistant_agent/observability/agent_service_delivery.py",
  "src/assistant_agent/observability/agent_service_latency.py",
]
thin_references = ["AGENTS.md", "docs/observability-harness.md"]
verification = [
  "python -c 'from assistant_agent.observability.trace_query import TraceQueryService'",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "test-policy"
authority = "tests/README.md"
read_when = [
  "新增或修改 pytest、选择 core/TDD/incubating 目录",
  "判断验证范围、core invariant 或汇报测试决策",
]
source_globs = [
  "tests/core/**",
  "tests/tdd/**",
  "pyproject.toml",
]
thin_references = ["AGENTS.md"]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/core/unit/test_test_policy.py",
]
exclusive_literals = []
exclusive_allowlist = []

[[domains]]
id = "system-eval"
authority = "evals/README.md"
read_when = [
  "system eval、真实能力专项验证或 operator 副作用门禁",
  "原生 Graph evaluation target 或未来行为评测重建",
]
source_globs = [
  "evals/system/**",
  "src/assistant_agent/evaluation/**",
  "scripts/run_system_ai_coding_behavior_eval.py",
]
thin_references = [
  "docs/observability-harness.md",
  "scripts/README.md",
]
verification = [
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/run_system_calendar_create_eval.py --dry-run",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python scripts/run_system_ai_coding_behavior_eval.py --dry-run --suite-id baseline-v1",
  "MULTIMODAL_AGENT_PROVIDER_MODE=mock python -m pytest -q tests/tdd/ai-coding-behavior-eval",
  "python -m compileall -q src/assistant_agent/evaluation evals/system",
]
exclusive_literals = []
