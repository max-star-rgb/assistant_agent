id: deep_research_admission
phase: decision
capability: deep_research_admission
risk: critical
request: 请深入研究未来两年企业采用 AI Agent 的主要风险，给我一份带来源、风险清单和分阶段建议的中文报告。这个任务可以在后台分阶段推进。
repetitions: 2
tool_contract:
  required: [workflow_submit]
  allowed: []
  forbidden: [web_search]
  arguments:
    - tool: workflow_submit
      path: workflow_type
      equals: deep_research
  sequence:
    before: []
    before_final_response: [workflow_submit]
fixtures:
  workflow_submit:
    - success: true
      data:
        workflow:
          submission_status: accepted
          workflow_id: release-decision-workflow
          workflow_type: deep_research
          status: queued
          phase: admitted
state_assertions:
  - path: status
    equals: completed

