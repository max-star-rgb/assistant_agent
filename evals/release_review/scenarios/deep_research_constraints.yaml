id: deep_research_constraints
phase: decision
capability: deep_research_constraint_grounding
risk: critical
request: 帮我研究 2025–2026 年中国企业采用 LLM Agent 可观测与质量平台时的技术选型。只看可私有化部署的方案，至少核对 12 个来源，官方文档优先。交付中文选型报告、风险清单和分阶段落地建议；未公开证明的能力标为待确认。允许后台分阶段推进。
repetitions: 2
tool_contract:
  required: [workflow_submit]
  allowed: []
  forbidden: [web_search]
  arguments:
    - tool: workflow_submit
      path: workflow_type
      equals: deep_research
    - tool: workflow_submit
      path: objective
      contains: 中国
    - tool: workflow_submit
      path: inputs.source_target
      gte: 12
    - tool: workflow_submit
      path: deliverables
      length: 3
  sequence:
    before: []
    before_final_response: [workflow_submit]
fixtures:
  workflow_submit:
    - success: true
      data:
        workflow:
          submission_status: accepted
          workflow_id: release-constraints-workflow
          workflow_type: deep_research
          status: queued
          phase: admitted
state_assertions:
  - path: status
    equals: completed

