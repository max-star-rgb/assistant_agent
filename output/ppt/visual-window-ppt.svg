<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EEF3FF"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8F0FF"/>
      <stop offset="1" stop-color="#F2EDFF"/>
    </linearGradient>
    <linearGradient id="vlm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6657E8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#243B6B" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5268D8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7657E6"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1740" cy="95" r="230" fill="#DED9FF" opacity="0.32"/>
  <circle cx="120" cy="1020" r="260" fill="#D8E8FF" opacity="0.34"/>

  <text x="120" y="118" fill="#18233D" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="56" font-weight="700">用户输入即截窗：理解“此刻”</text>
  <text x="120" y="174" fill="#66718A" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27">最多 5 个语义关键帧组成一个窗口；用户一开口，当前窗口立即冻结</text>

  <g filter="url(#shadow)">
    <rect x="105" y="230" width="1710" height="590" rx="34" fill="#FFFFFF"/>
  </g>

  <text x="155" y="294" fill="#7A849A" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600">实时视频 · 语义关键帧时间轴</text>
  <line x1="190" y1="475" x2="1705" y2="475" stroke="#C8D2E8" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="160" y="330" width="840" height="290" rx="28" fill="url(#window)" stroke="#AFC2F4" stroke-width="2"/>
  <text x="190" y="375" fill="#5268D8" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">当前视觉窗口</text>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <g transform="translate(235 400)">
      <rect width="180" height="130" rx="18" fill="#FFFFFF" stroke="#94ACEA" stroke-width="3"/>
      <path d="M28 95 L70 55 L100 80 L125 47 L153 95 Z" fill="#D9E5FF"/>
      <circle cx="54" cy="39" r="13" fill="#F5C96A"/>
      <text x="90" y="166" text-anchor="middle" fill="#526079" font-size="22">关键帧 F1</text>
    </g>
    <g transform="translate(485 400)">
      <rect width="180" height="130" rx="18" fill="#FFFFFF" stroke="#809CE5" stroke-width="3"/>
      <path d="M28 95 L70 55 L100 80 L125 47 L153 95 Z" fill="#CADBFF"/>
      <circle cx="54" cy="39" r="13" fill="#F5C96A"/>
      <rect x="112" y="29" width="35" height="48" rx="6" fill="#9AB2EF"/>
      <text x="90" y="166" text-anchor="middle" fill="#526079" font-size="22">关键帧 F2</text>
    </g>
    <g transform="translate(735 400)">
      <rect width="180" height="130" rx="18" fill="#FFFFFF" stroke="#7657E6" stroke-width="5"/>
      <path d="M28 95 L70 55 L100 80 L125 47 L153 95 Z" fill="#D8D2FF"/>
      <circle cx="54" cy="39" r="13" fill="#F5C96A"/>
      <rect x="105" y="25" width="48" height="64" rx="8" fill="#8B76EB"/>
      <circle cx="129" cy="47" r="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="90" y="166" text-anchor="middle" fill="#5B43C6" font-size="22" font-weight="700">目标帧 F3</text>
    </g>
  </g>

  <line x1="1000" y1="315" x2="1000" y2="670" stroke="#FF6B57" stroke-width="6" stroke-dasharray="14 10"/>
  <rect x="886" y="268" width="228" height="58" rx="29" fill="#FF6B57"/>
  <text x="1000" y="306" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700">用户输入 K</text>
  <text x="1000" y="706" text-anchor="middle" fill="#D84E3B" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700">立即冻结并关闭窗口</text>

  <path d="M930 580 C1060 610 1080 690 1195 690" fill="none" stroke="#7657E6" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <g filter="url(#shadow)">
    <rect x="1200" y="590" width="310" height="160" rx="28" fill="url(#vlm)"/>
  </g>
  <text x="1355" y="652" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700">多图 VLM</text>
  <text x="1355" y="698" text-anchor="middle" fill="#EDE9FF" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21">F1、F2 理解变化</text>
  <text x="1355" y="728" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700">F3 代表“此刻”</text>
  <line x1="1510" y1="670" x2="1638" y2="670" stroke="#7657E6" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <rect x="1645" y="608" width="120" height="124" rx="26" fill="#ECF8F2" stroke="#71C69C" stroke-width="3"/>
  <path d="M1682 670 l20 20 l35 -42" fill="none" stroke="#35A66F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1705" y="764" text-anchor="middle" fill="#27865A" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">预备回答</text>

  <g opacity="0.95" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="1080" y="360" width="155" height="105" rx="16" fill="#F8FAFF" stroke="#B7C6E8" stroke-width="3"/>
    <text x="1157" y="421" text-anchor="middle" fill="#68758D" font-size="21">关键帧 F4</text>
    <rect x="1285" y="360" width="155" height="105" rx="16" fill="#F8FAFF" stroke="#B7C6E8" stroke-width="3"/>
    <text x="1362" y="421" text-anchor="middle" fill="#68758D" font-size="21">关键帧 F5</text>
    <rect x="1490" y="360" width="155" height="105" rx="16" fill="#F8FAFF" stroke="#B7C6E8" stroke-width="3"/>
    <text x="1567" y="421" text-anchor="middle" fill="#68758D" font-size="21">……</text>
    <path d="M1090 525 Q1360 565 1625 525" fill="none" stroke="#5A78C9" stroke-width="3"/>
    <text x="1358" y="557" text-anchor="middle" fill="#5268A7" font-size="21" font-weight="600">后续采帧继续，不等待 VLM</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="105" y="866" width="1710" height="126" rx="28" fill="#18233D"/>
    <circle cx="165" cy="929" r="27" fill="#FFCE5C"/>
    <text x="165" y="938" text-anchor="middle" fill="#18233D" font-size="28" font-weight="800">!</text>
    <text x="215" y="922" fill="#FFFFFF" font-size="30" font-weight="700">核心：5 帧是窗口上限，不是固定抽取的连续视频帧</text>
    <text x="215" y="960" fill="#BFC9DC" font-size="22">语义变化决定选帧；用户输入决定窗口边界</text>
  </g>
</svg>
