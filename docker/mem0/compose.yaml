name: assistant-agent-mem0

services:
  mem0:
    image: assistant-agent/mem0-sidecar:2.0.11
    build:
      context: .
      dockerfile: Mem0.Dockerfile
    profiles: ["mem0"]
    ports:
      - "127.0.0.1:8890:8000"
    environment:
      AUTH_DISABLED: "true"
      MEM0_TELEMETRY: "False"
      OPENAI_API_KEY: ${QWEN_API_KEY:-${DASHSCOPE_API_KEY:-}}
      OPENAI_BASE_URL: ${QWEN_CHAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_MODEL: ${QWEN_CHAT_MODEL:-qwen-plus}
      EMBEDDING_API_KEY: ${QWEN_API_KEY:-${DASHSCOPE_API_KEY:-}}
      EMBEDDING_BASE_URL: ${QWEN_CHAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${MEM0_EMBEDDING_MODEL:-text-embedding-v4}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_TIMEOUT_SECONDS: "30"
      HISTORY_DB_PATH: /data/history/history.db
    volumes:
      - mem0_history:/data/history
      - ./mem0_sidecar.py:/app/mem0_sidecar.py:ro
      - ./mem0_env.py:/app/mem0_env.py:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=60)"]
      interval: 15s
      timeout: 65s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.18.3
    profiles: ["mem0", "visual-memory"]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mem0_history:
  qdrant_data:
