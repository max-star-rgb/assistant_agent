[program:assistant-agent]
directory=/home/lenovo1/pycharm_project/assistant_agent
command=/home/lenovo1/miniconda3/envs/hello_agent/bin/python scripts/run_server.py --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/home/lenovo1/pycharm_project/assistant_agent/.data/logs/supervisor-assistant-agent.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
