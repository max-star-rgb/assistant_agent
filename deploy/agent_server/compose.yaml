name: assistant-agent-langgraph

services:
  langgraph-redis:
    image: redis:6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 1s
      retries: 5
    restart: unless-stopped

  langgraph-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "shared_preload_libraries=vector"]
    volumes:
      - assistant-agent-langgraph-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 10s
      interval: 5s
      timeout: 1s
      retries: 5
    restart: unless-stopped

  langgraph-api:
    image: assistant-agent/langgraph-api:local
    env_file:
      - ${ASSISTANT_AGENT_ENV_FILE:-../../.env}
    environment:
      POSTGRES_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
      REDIS_URI: redis://langgraph-redis:6379
    ports:
      - "127.0.0.1:${ASSISTANT_AGENT_SERVER_PORT:-8090}:8000"
    depends_on:
      langgraph-postgres:
        condition: service_healthy
      langgraph-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/api/healthcheck.py"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  assistant-agent-langgraph-postgres-data:
    name: assistant-agent-langgraph-postgres-data
    driver: local
