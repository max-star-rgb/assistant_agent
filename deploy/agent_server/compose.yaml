name: assistant-agent-langgraph

services:
  langgraph-redis:
    image: redis:6
    ports:
      - "127.0.0.1:6388:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 1s
      retries: 5
    restart: unless-stopped

  langgraph-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "shared_preload_libraries=vector"]
    ports:
      - "127.0.0.1:6433:5432"
    volumes:
      - assistant-agent-langgraph-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 10s
      interval: 5s
      timeout: 1s
      retries: 5
    restart: unless-stopped

  langgraph-api:
    image: assistant-agent/langgraph-api:local
    env_file:
      - ${ASSISTANT_AGENT_ENV_FILE:-../../.env}
    environment:
      POSTGRES_URI: postgres://postgres:postgres@127.0.0.1:6433/postgres?sslmode=disable
      REDIS_URI: redis://127.0.0.1:6388
      LANGGRAPH_SERVER_HOST: 127.0.0.1
      LANGGRAPH_SERVER_PORT: ${ASSISTANT_AGENT_SERVER_PORT:-8089}
      PORT: ${ASSISTANT_AGENT_SERVER_PORT:-8089}
      HOME: ${HOME}
      PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.nvm/versions/node/v24.16.0/bin:${PATH}
      LD_LIBRARY_PATH: ${HOME}/miniconda3/envs/hello_agent/lib/python3.12/site-packages/nvidia/cublas/lib:${HOME}/miniconda3/envs/hello_agent/lib/python3.12/site-packages/nvidia/cudnn/lib:${HOME}/miniconda3/envs/hello_agent/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:${HOME}/miniconda3/envs/hello_agent/lib/python3.12/site-packages/nvidia/curand/lib:${HOME}/miniconda3/envs/hello_agent/lib/python3.12/site-packages/nvidia/cufft/lib:/usr/local/nvidia/lib64
    # Trusted single-host deployment: retain host service URLs and execution paths.
    network_mode: host
    gpus: all
    volumes:
      - ${HOME}:${HOME}
      - ../../.data:/deps/assistant_agent/.data
      - ../../.local:/deps/assistant_agent/.local
    depends_on:
      langgraph-postgres:
        condition: service_healthy
      langgraph-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/api/healthcheck.py"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  assistant-agent-langgraph-postgres-data:
    name: assistant-agent-langgraph-postgres-data
    driver: local
