<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant Chat</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #20242c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      section {
        margin-bottom: 14px;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
        padding: 16px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 15px;
      }

      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 9px 12px;
        font: inherit;
        font-weight: 650;
        background: #205493;
        color: #ffffff;
        cursor: pointer;
      }

      button.example {
        background: #eef2f7;
        color: #344054;
        border: 1px solid #cfd7e4;
      }

      button:disabled {
        background: #8a96a8;
        cursor: wait;
      }

      .input-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 112px;
        gap: 10px;
      }

      textarea {
        width: 100%;
        min-height: 96px;
        resize: vertical;
        border: 1px solid #c7ced9;
        border-radius: 6px;
        padding: 10px;
        font: inherit;
      }

      pre {
        overflow: auto;
        min-height: 120px;
        max-height: 520px;
        margin: 0;
        border: 1px solid #e1e6ef;
        border-radius: 6px;
        padding: 12px;
        background: #101828;
        color: #f8fafc;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      #final-response {
        background: #fbfcfe;
        color: #20242c;
      }

      .conversation {
        min-height: 180px;
      }

      .status {
        margin-top: 8px;
        min-height: 20px;
        color: #667085;
        font-size: 13px;
      }

      .error {
        color: #b42318;
      }

      @media (max-width: 720px) {
        .input-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Assistant Chat</h1>

      <section>
        <h2>Examples</h2>
        <div class="examples" id="examples">
          <button class="example" type="button">你好，简单介绍一下你能做什么。</button>
          <button class="example" type="button">帮我找一款适合通勤的无线蓝牙耳机，并比较一下价格，最后给出推荐理由。</button>
          <button class="example" type="button">生成一张白色运动鞋的电商主图，干净背景，真实摄影风格。</button>
          <button class="example" type="button">帮我写一段适合小红书的商品介绍。</button>
        </div>
      </section>

      <section>
        <h2>Input</h2>
        <div class="input-row">
          <textarea id="message">你好，简单介绍一下你能做什么。</textarea>
          <button id="send" type="button">Send</button>
        </div>
        <div class="status" id="status">ready</div>
      </section>

      <section>
        <h2>Conversation History</h2>
        <pre class="conversation" id="final-response"></pre>
      </section>

      <section>
        <h2>Assistant ReAct Process</h2>
        <pre id="react-process"></pre>
      </section>
    </main>

    <script>
      const messageInput = document.querySelector("#message");
      const sendButton = document.querySelector("#send");
      const statusOutput = document.querySelector("#status");
      const finalResponse = document.querySelector("#final-response");
      const reactProcess = document.querySelector("#react-process");
      let runtimeInfo = null;
      const conversationHistory = [];

      document.querySelector("#examples").addEventListener("click", (event) => {
        if (event.target.matches("button.example")) {
          messageInput.value = event.target.textContent;
          messageInput.focus();
        }
      });

      sendButton.addEventListener("click", runAssistant);
      messageInput.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          runAssistant();
        }
      });

      async function runAssistant() {
        const text = messageInput.value.trim();
        if (!text) {
          setStatus("请输入消息。", true);
          return;
        }
        sendButton.disabled = true;
        renderConversationHistory([...conversationHistory, { user: text, assistant: "running..." }]);
        reactProcess.textContent = "";
        setStatus("running...");
        try {
          const payload = await fetchJson("/agent/run", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              user_id: "web_chat_user",
              session_id: "web_chat_session",
              text,
              metadata: { source: "web_chat", dotenv: true },
            }),
          });
          conversationHistory.push({
            user: text,
            assistant: payload.response_text || "(empty response)",
            status: payload.status || "completed",
            run_id: payload.run_id,
            trace_id: payload.trace_id,
          });
          renderConversationHistory(conversationHistory);
          reactProcess.textContent = [formatRuntimeInfo(), formatReactSteps(payload.react_steps || [])]
            .filter(Boolean)
            .join("\n\n");
          setStatus(`done | run_id=${payload.run_id} | trace_id=${payload.trace_id}`);
        } catch (error) {
          conversationHistory.push({
            user: text,
            assistant: String(error),
            status: "failed",
          });
          renderConversationHistory(conversationHistory);
          reactProcess.textContent = "";
          setStatus(String(error), true);
        } finally {
          sendButton.disabled = false;
        }
      }

      function renderConversationHistory(turns) {
        if (!turns.length) {
          finalResponse.textContent = "";
          return;
        }
        finalResponse.textContent = turns
          .map((turn, index) => {
            const meta = [
              turn.status ? `status=${turn.status}` : null,
              turn.run_id ? `run_id=${turn.run_id}` : null,
              turn.trace_id ? `trace_id=${turn.trace_id}` : null,
            ]
              .filter(Boolean)
              .join(" | ");
            return [
              `#${index + 1}`,
              `User: ${turn.user}`,
              `Assistant: ${turn.assistant}`,
              meta ? `(${meta})` : null,
            ]
              .filter(Boolean)
              .join("\n");
          })
          .join("\n\n");
      }

      function formatReactSteps(steps) {
        if (!steps.length) {
          return "(no ReAct steps recorded)";
        }
        return steps
          .map((step) => {
            if (step.observation_tool) {
              return [
                `[${step.iteration}] observation: ${step.observation_tool}`,
                `success: ${step.success}`,
                step.summary ? `summary: ${step.summary}` : null,
                step.output_ref ? `output_ref: ${step.output_ref}` : null,
                step.error ? `error: ${step.error}` : null,
              ]
                .filter(Boolean)
                .join("\n");
            }
            return [
              `[${step.iteration}] thought/decision: ${step.decision_type}`,
              step.tool_name ? `action: ${step.tool_name}` : null,
              step.tool_input ? `action_input: ${JSON.stringify(step.tool_input)}` : null,
              step.reason ? `reason: ${step.reason}` : null,
              step.message && step.decision_type !== "tool_call" ? `answer: ${step.message}` : null,
            ]
              .filter(Boolean)
              .join("\n");
          })
          .join("\n\n");
      }

      function formatRuntimeInfo() {
        if (!runtimeInfo) {
          return "";
        }
        const providers = runtimeInfo.providers || {};
        return [
          `runtime_profile: ${runtimeInfo.runtime_profile}`,
          `graph_mode: ${runtimeInfo.graph_mode}`,
          `assistant_brain: ${providers.chat || "unknown"}`,
          `image_provider: ${providers.image_generation || "unknown"}`,
          `product_search_provider: ${providers.product_search || "unknown"}`,
        ].join("\n");
      }

      async function fetchJson(url, options) {
        const response = await fetch(url, options);
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.detail || payload.message || `HTTP ${response.status}`);
        }
        return payload;
      }

      function setStatus(text, isError = false) {
        statusOutput.textContent = text;
        statusOutput.classList.toggle("error", isError);
      }

      fetchJson("/demo/runtime-info")
        .then((payload) => {
          runtimeInfo = payload;
        })
        .catch(() => {
          runtimeInfo = null;
        });
    </script>
  </body>
</html>
