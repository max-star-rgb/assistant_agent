<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant Chat</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #20242c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      section {
        margin-bottom: 14px;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
        padding: 16px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 15px;
      }

      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 9px 12px;
        font: inherit;
        font-weight: 650;
        background: #205493;
        color: #ffffff;
        cursor: pointer;
      }

      button.example {
        background: #eef2f7;
        color: #344054;
        border: 1px solid #cfd7e4;
      }

      button:disabled {
        background: #8a96a8;
        cursor: wait;
      }

      .input-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 112px;
        gap: 10px;
      }

      textarea {
        width: 100%;
        min-height: 96px;
        resize: vertical;
        border: 1px solid #c7ced9;
        border-radius: 6px;
        padding: 10px;
        font: inherit;
      }

      .media-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }

      .trial-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: end;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: #475467;
        font-size: 13px;
        font-weight: 650;
      }

      input[type="text"] {
        width: 100%;
        border: 1px solid #c7ced9;
        border-radius: 6px;
        padding: 9px 10px;
        font: inherit;
      }

      pre {
        overflow: auto;
        min-height: 120px;
        max-height: 520px;
        margin: 0;
        border: 1px solid #e1e6ef;
        border-radius: 6px;
        padding: 12px;
        background: #101828;
        color: #f8fafc;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .conversation {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 180px;
      }

      .turn {
        display: flex;
        width: 100%;
      }

      .turn.user {
        justify-content: flex-end;
      }

      .turn.assistant {
        justify-content: flex-start;
      }

      .bubble {
        max-width: min(78%, 720px);
        border: 1px solid #d9dee7;
        border-radius: 8px;
        padding: 10px 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .turn.user .bubble {
        background: #e8f1fb;
        border-color: #b9cfe8;
        color: #183b61;
      }

      .turn.assistant .bubble {
        background: #fbfcfe;
        border-color: #d9dee7;
        color: #20242c;
      }

      .artifact-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .artifact-card {
        border: 1px solid #d9dee7;
        border-radius: 8px;
        overflow: hidden;
        background: #ffffff;
      }

      .artifact-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        background: #f2f4f7;
      }

      .artifact-actions {
        display: flex;
        gap: 8px;
        padding: 10px;
      }

      .artifact-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        border-radius: 6px;
        padding: 7px 10px;
        background: #eef2f7;
        color: #243b53;
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
        border: 1px solid #cfd7e4;
      }

      .product-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }

      .product-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
        padding: 12px;
      }

      .product-card.recommended {
        border-color: #205493;
      }

      .product-title {
        margin: 0;
        font-size: 14px;
        line-height: 1.35;
      }

      .product-price {
        color: #175cd3;
        font-size: 18px;
        font-weight: 750;
      }

      .product-meta,
      .product-reason {
        color: #667085;
        font-size: 13px;
        line-height: 1.4;
      }

      .product-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        border-radius: 6px;
        padding: 7px 10px;
        background: #eef2f7;
        color: #243b53;
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
        border: 1px solid #cfd7e4;
      }

      .status {
        margin-top: 8px;
        min-height: 20px;
        color: #667085;
        font-size: 13px;
      }

      .error {
        color: #b42318;
      }

      @media (max-width: 720px) {
        .input-row {
          grid-template-columns: 1fr;
        }

        .trial-row {
          grid-template-columns: 1fr;
        }

        .media-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Assistant Chat</h1>

      <section>
        <h2>试用入口</h2>
        <div class="trial-row">
          <div class="field">
            <label for="trial-user-id">工号</label>
            <input id="trial-user-id" type="text" placeholder="请输入你的工号：00xxxx" autocomplete="username" />
          </div>
          <button id="save-user" type="button">确认</button>
        </div>
        <div class="status" id="user-status">请输入你的工号：00xxxx</div>
      </section>

      <section data-requires-access hidden>
        <h2>Examples</h2>
        <div class="examples" id="examples"></div>
      </section>

      <section data-requires-access hidden>
        <h2>Input</h2>
        <div class="input-row">
          <textarea id="message">你好，简单介绍一下你能做什么。</textarea>
          <button id="send" type="button" disabled>Send</button>
        </div>
        <div class="media-row">
          <input id="image-ids" type="text" placeholder="Image IDs（逗号或换行分隔，可选）" />
          <input id="video-ids" type="text" placeholder="Video IDs（逗号或换行分隔，可选）" />
        </div>
        <div class="status" id="status">ready</div>
      </section>

      <section data-requires-access hidden>
        <h2>Conversation History</h2>
        <div class="conversation" id="final-response"></div>
      </section>

      <section id="products-section" hidden>
        <h2>Product Results</h2>
        <div class="product-gallery" id="product-gallery"></div>
      </section>

      <section id="artifacts-section" hidden>
        <h2>Generated Images</h2>
        <div class="artifact-gallery" id="artifact-gallery"></div>
      </section>

      <section data-requires-access hidden>
        <h2>Assistant ReAct Process</h2>
        <pre id="react-process"></pre>
      </section>
    </main>

    <script>
      const messageInput = document.querySelector("#message");
      const imageIdsInput = document.querySelector("#image-ids");
      const videoIdsInput = document.querySelector("#video-ids");
      const trialUserIdInput = document.querySelector("#trial-user-id");
      const saveUserButton = document.querySelector("#save-user");
      const userStatus = document.querySelector("#user-status");
      const sendButton = document.querySelector("#send");
      const statusOutput = document.querySelector("#status");
      const finalResponse = document.querySelector("#final-response");
      const reactProcess = document.querySelector("#react-process");
      const productsSection = document.querySelector("#products-section");
      const productGallery = document.querySelector("#product-gallery");
      const artifactsSection = document.querySelector("#artifacts-section");
      const artifactGallery = document.querySelector("#artifact-gallery");
      const accessSections = document.querySelectorAll("[data-requires-access]");
      const examplesContainer = document.querySelector("#examples");
      let runtimeInfo = null;
      let verifiedTrialUserId = "";
      const conversationHistory = [];
      const USER_STORAGE_KEY = "multimodal_agent_trial_user_id";

      document.querySelector("#examples").addEventListener("click", (event) => {
        if (event.target.matches("button.example")) {
          messageInput.value = event.target.textContent;
          messageInput.focus();
        }
      });

      saveUserButton.addEventListener("click", () => {
        void saveTrialUserId();
      });
      trialUserIdInput.addEventListener("input", handleTrialUserInputChanged);
      trialUserIdInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          void saveTrialUserId();
        }
      });
      sendButton.addEventListener("click", runAssistant);
      messageInput.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          runAssistant();
        }
      });

      async function runAssistant() {
        const text = messageInput.value.trim();
        const userId = currentTrialUserId();
        if (!userId) {
          setUserStatus("请先验证工号。", true);
          trialUserIdInput.focus();
          return;
        }
        if (!text) {
          setStatus("请输入消息。", true);
          return;
        }
        sendButton.disabled = true;
        renderConversationHistory([...conversationHistory, { user: text, assistant: "running..." }]);
        reactProcess.textContent = "";
        setStatus("running...");
        try {
          const payload = await runAssistantStream(text);
          const artifacts = collectImageArtifacts(payload);
          const products = collectProductResults(payload);
          conversationHistory.push({
            user: text,
            assistant: payload.response_text || "(empty response)",
            status: payload.status || "completed",
            run_id: payload.run_id,
            trace_id: payload.trace_id,
            artifacts,
            products,
          });
          renderConversationHistory(conversationHistory);
          renderProductGallery(conversationHistory.flatMap((turn) => turn.products || []));
          renderArtifactGallery(conversationHistory.flatMap((turn) => turn.artifacts || []));
          reactProcess.textContent = formatReactProcess(payload, payload._timeline_lines || null);
          setStatus(`done | run_id=${payload.run_id} | trace_id=${payload.trace_id}`);
        } catch (error) {
          conversationHistory.push({
            user: text,
            assistant: String(error),
            status: "failed",
          });
          renderConversationHistory(conversationHistory);
          renderProductGallery(conversationHistory.flatMap((turn) => turn.products || []));
          renderArtifactGallery(conversationHistory.flatMap((turn) => turn.artifacts || []));
          reactProcess.textContent = "";
          setStatus(String(error), true);
        } finally {
          sendButton.disabled = false;
        }
      }

      function parseIds(value) {
        return (value || "")
          .split(/[\n,]/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function runAssistantStream(text) {
        const userId = currentTrialUserId();
        const sessionId = `web_trial_${safeId(userId)}`;
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const params = new URLSearchParams();
        params.set("user_id", userId);
        params.set("text", text);
        for (const id of parseIds(imageIdsInput.value)) {
          params.append("image_id", id);
        }
        for (const id of parseIds(videoIdsInput.value)) {
          params.append("video_id", id);
        }
        const url = `${protocol}//${window.location.host}/ws/agent/${encodeURIComponent(sessionId)}?${params.toString()}`;
        const eventLines = [];
        reactProcess.textContent = formatRuntimeInfo();
        return new Promise((resolve, reject) => {
          const socket = new WebSocket(url);
          let finalPayload = null;
          let finalError = null;
          socket.onopen = () => renderLiveProcess(eventLines, null);
          socket.onmessage = (message) => {
            const event = JSON.parse(message.data);
            const timelineLine = formatTimelineEvent(event);
            if (timelineLine) {
              eventLines.push(timelineLine);
            }
            if (event.type === "agent_response" && event.payload && event.payload.response) {
              finalPayload = event.payload.response;
              finalPayload._timeline_lines = eventLines.slice();
              renderLiveProcess(eventLines, finalPayload);
            } else {
              if (event.type === "agent_error") {
                finalError = event.error || "WebSocket 运行失败。";
              }
              renderLiveProcess(eventLines, null);
            }
          };
          socket.onerror = () => {
            reject(new Error("WebSocket 连接失败。"));
          };
          socket.onclose = () => {
            if (finalPayload) {
              resolve(finalPayload);
            } else if (finalError) {
              reject(new Error(errorMessage(finalError)));
            } else {
              reject(new Error("WebSocket 已关闭，但没有收到最终回复。"));
            }
          };
        });
      }

      async function saveTrialUserId() {
        const userId = normalizeUserId(trialUserIdInput.value);
        if (!userId) {
          setUserStatus("工号不能为空。", true);
          return;
        }
        saveUserButton.disabled = true;
        setUserStatus("正在验证工号...");
        try {
          const access = await validateTrialUserId(userId);
          verifiedTrialUserId = access.user_id || userId;
          localStorage.setItem(USER_STORAGE_KEY, verifiedTrialUserId);
          trialUserIdInput.value = verifiedTrialUserId;
          conversationHistory.length = 0;
          renderConversationHistory(conversationHistory);
          renderProductGallery([]);
          renderArtifactGallery([]);
          reactProcess.textContent = "";
          setExperienceEnabled(true);
          setUserStatus(
            access.access_required ? `已验证工号：${verifiedTrialUserId}` : `当前工号：${verifiedTrialUserId}`,
          );
          setStatus("ready");
        } catch (error) {
          verifiedTrialUserId = "";
          localStorage.removeItem(USER_STORAGE_KEY);
          setExperienceEnabled(false);
          setUserStatus(errorMessage(error), true);
        } finally {
          saveUserButton.disabled = false;
        }
      }

      function currentTrialUserId() {
        return verifiedTrialUserId;
      }

      async function validateTrialUserId(userId) {
        const params = new URLSearchParams();
        params.set("user_id", userId);
        const access = await fetchJson(`/demo/access?${params.toString()}`);
        if (!access.allowed) {
          throw new Error(access.reason || "该工号不在服务器试用名单中。");
        }
        return access;
      }

      function handleTrialUserInputChanged() {
        const typed = normalizeUserId(trialUserIdInput.value);
        if (!verifiedTrialUserId || typed === verifiedTrialUserId) {
          return;
        }
        verifiedTrialUserId = "";
        setExperienceEnabled(false);
        setUserStatus("工号已修改，请重新验证。");
      }

      function normalizeUserId(value) {
        return String(value || "")
          .trim()
          .replace(/\s+/g, "_")
          .slice(0, 64);
      }

      function safeId(value) {
        return normalizeUserId(value) || "anonymous";
      }

      function renderLiveProcess(eventLines, finalPayload) {
        if (finalPayload) {
          reactProcess.textContent = formatReactProcess(finalPayload, eventLines);
          return;
        }
        reactProcess.textContent = eventLines.length ? ["Timeline", eventLines.join("\n")].join("\n\n") : "";
      }

      function formatTimelineEvent(event) {
        const trace = event.payload && event.payload.decision_trace;
        if (event.type === "task_started") {
          return `[run] started ${event.run_id}`;
        }
        if (event.type === "tool_started" && event.tool_name) {
          return `[tool:${event.tool_name}] running...`;
        }
        if (trace) {
          return formatTimelineTrace(trace);
        }
        if (event.type === "task_failed") {
          const message = eventErrorMessage(event.error);
          return message ? `[run] failed\n       error: ${message}` : "[run] failed";
        }
        if (event.type === "agent_error") {
          const message = eventErrorMessage(event.error);
          return message ? `[error] ${message}` : "[error] agent failed";
        }
        return "";
      }

      function formatReactProcess(payload, timelineLines = null) {
        const sections = [];
        const timeline = timelineLines && timelineLines.length ? timelineLines.join("\n") : timelineFromPayload(payload).join("\n");
        if (timeline) {
          sections.push("Timeline", timeline);
        }
        sections.push(formatRunSummary(payload));
        const toolResults = formatToolResults(payload.tool_results || []);
        if (toolResults) {
          sections.push(toolResults);
        }
        const errors = formatErrors(payload.errors || []);
        if (errors) {
          sections.push(errors);
        }
        return sections.filter(Boolean).join("\n\n");
      }

      function timelineFromPayload(payload) {
        const lines = [];
        for (const step of payload.decision_trace || []) {
          const formatted = formatTimelineTrace(step);
          if (formatted) {
            lines.push(formatted);
          }
        }
        if (!lines.length && payload.response_text) {
          lines.push(`[answer]\n${safeDisplayValue(payload.response_text)}`);
        }
        return lines;
      }

      function formatTimelineTrace(trace) {
        if (trace.event === "decision") {
          const lines = [`[plan] ${trace.action || trace.decision_type || "decision"}`];
          if (trace.decision_summary) {
            lines.push(`       reason: ${trace.decision_summary}`);
          }
          const actionInput = publicActionInput(trace.action_input || {});
          if (Object.keys(actionInput).length) {
            lines.push(`       input: ${compactJson(actionInput)}`);
          }
          return lines.join("\n");
        }
        if (trace.event === "observation") {
          const action = trace.action || "tool";
          const status = trace.success ? "succeeded" : "failed";
          const lines = [`[tool:${action}] ${status}`];
          if (trace.output_ref) {
            lines.push(`       artifact: ${safeDisplayValue(trace.output_ref)}`);
          }
          if (trace.error) {
            lines.push(`       error: ${eventErrorMessage(trace.error)}`);
          }
          if (trace.recovery_hint) {
            lines.push(`       recovery: ${trace.recovery_hint}`);
          }
          return lines.join("\n");
        }
        if (trace.event === "final_answer") {
          const answer = safeDisplayValue(trace.answer || "");
          return answer ? `[answer]\n${answer}` : "[answer]";
        }
        return "";
      }

      function formatRunSummary(payload) {
        const data = payload.data || {};
        const toolNames = (payload.tool_calls || [])
          .map((call) => call.tool_name)
          .filter(Boolean);
        if (!toolNames.length) {
          (payload.tool_results || []).forEach((result) => {
            if (result.tool_name) {
              toolNames.push(result.tool_name);
            }
          });
        }
        const status = payload.status === "failed" || (payload.errors || []).length ? "failed" : "success";
        const lines = [
          "Run",
          `  status: ${status}`,
          `  tools: ${toolNames.length ? toolNames.join(", ") : "(none)"}`,
        ];
        if (data.final_answer_source) {
          lines.push(`  final_answer_source: ${data.final_answer_source}`);
        }
        lines.push(`  run_id: ${payload.run_id || ""}`);
        lines.push(`  trace_id: ${payload.trace_id || ""}`);
        return lines.join("\n");
      }

      function compactJson(value, maxLength = 360) {
        const text = JSON.stringify(value);
        return text.length <= maxLength ? text : `${text.slice(0, maxLength - 3)}...`;
      }

      function publicActionInput(value) {
        const result = {};
        for (const [key, item] of Object.entries(value || {})) {
          if (
            item == null ||
            item === "" ||
            (Array.isArray(item) && !item.length) ||
            (typeof item === "object" && !Array.isArray(item) && !Object.keys(item).length)
          ) {
            continue;
          }
          if (["memory_context", "user_id", "session_id", "product_info", "reference_image_ids"].includes(key)) {
            continue;
          }
          result[key] = item;
        }
        return result;
      }

      function eventErrorMessage(error) {
        if (error && typeof error === "object") {
          return safeDisplayValue(String(error.message || error.code || JSON.stringify(error)));
        }
        return error ? safeDisplayValue(String(error)) : "";
      }

      function renderConversationHistory(turns) {
        finalResponse.textContent = "";
        if (!turns.length) {
          return;
        }
        for (const turn of turns) {
          appendConversationBubble("user", turn.user);
          appendConversationBubble("assistant", turn.assistant);
        }
      }

      function appendConversationBubble(role, text) {
        const row = document.createElement("div");
        row.className = `turn ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text || "";
        row.appendChild(bubble);
        finalResponse.appendChild(row);
      }

      function collectImageArtifacts(payload) {
        const artifacts = [];
        const seen = new Set();
        for (const result of payload.tool_results || []) {
          const data = result.data || {};
          const candidates = [
            ...(Array.isArray(data.download_urls) ? data.download_urls : []),
            data.download_url,
            ...(Array.isArray(data.image_urls) ? data.image_urls : []),
            data.image_url,
            result.output_ref,
          ];
          for (const candidate of candidates) {
            const url = normalizeArtifactUrl(candidate);
            if (!url || seen.has(url)) {
              continue;
            }
            seen.add(url);
            artifacts.push({
              url,
              title: data.prompt_used || data.prompt || result.tool_name || "generated image",
            });
          }
        }
        return artifacts;
      }

      function normalizeArtifactUrl(value) {
        const raw = String(value || "").trim();
        if (!raw) {
          return null;
        }
        if (/^https?:\/\//i.test(raw)) {
          return raw;
        }
        if (raw.startsWith("/artifacts/")) {
          return raw;
        }
        if (raw.startsWith("artifacts/")) {
          return `/${raw}`;
        }
        return null;
      }

      function renderArtifactGallery(artifacts) {
        artifactGallery.textContent = "";
        artifactsSection.hidden = artifacts.length === 0;
        for (const artifact of artifacts) {
          const card = document.createElement("div");
          card.className = "artifact-card";

          const image = document.createElement("img");
          image.src = artifact.url;
          image.alt = artifact.title;
          image.loading = "lazy";
          card.appendChild(image);

          const actions = document.createElement("div");
          actions.className = "artifact-actions";

          const openLink = document.createElement("a");
          openLink.href = artifact.url;
          openLink.target = "_blank";
          openLink.rel = "noopener";
          openLink.textContent = "Open";
          actions.appendChild(openLink);

          const downloadLink = document.createElement("a");
          downloadLink.href = artifact.url;
          downloadLink.download = "";
          downloadLink.textContent = "Download";
          actions.appendChild(downloadLink);

          card.appendChild(actions);
          artifactGallery.appendChild(card);
        }
      }

      function collectProductResults(payload) {
        const productsByKey = new Map();
        const addProduct = (item, options = {}) => {
          if (!item || typeof item !== "object") {
            return;
          }
          const title = item.title || "候选商品";
          const price = item.total_price ?? item.price;
          const currency = item.currency || "CNY";
          const url = item.product_url || item.url;
          const key = url || item.product_id || `${title}:${price ?? ""}`;
          const existing = productsByKey.get(key) || {};
          productsByKey.set(key, {
            ...existing,
            title,
            price,
            currency,
            url,
            platform: item.platform || existing.platform,
            shop: item.shop || existing.shop,
            reason:
              item.reason ||
              (item.ranking_reason && item.ranking_reason.explanation) ||
              existing.reason ||
              "",
            recommended: Boolean(options.recommended || existing.recommended),
          });
        };

        for (const result of payload.tool_results || []) {
          const data = result.data || {};
          if (result.tool_name === "price_compare") {
            addProduct(data.best_offer, { recommended: true });
            (Array.isArray(data.offers) ? data.offers : []).slice(0, 5).forEach((item) => addProduct(item));
          }
        }
        for (const result of payload.tool_results || []) {
          const data = result.data || {};
          (Array.isArray(data.items) ? data.items : []).slice(0, 5).forEach((item) => addProduct(item));
        }
        return Array.from(productsByKey.values())
          .sort((a, b) => Number(b.recommended) - Number(a.recommended))
          .slice(0, 8);
      }

      function renderProductGallery(products) {
        productGallery.textContent = "";
        productsSection.hidden = products.length === 0;
        for (const product of products) {
          const card = document.createElement("div");
          card.className = `product-card${product.recommended ? " recommended" : ""}`;

          const title = document.createElement("h3");
          title.className = "product-title";
          title.textContent = product.recommended ? `推荐：${product.title}` : product.title;
          card.appendChild(title);

          if (product.price != null) {
            const price = document.createElement("div");
            price.className = "product-price";
            price.textContent = `${product.price} ${product.currency || "CNY"}`;
            card.appendChild(price);
          }

          const metaText = [product.platform, product.shop].filter(Boolean).join(" · ");
          if (metaText) {
            const meta = document.createElement("div");
            meta.className = "product-meta";
            meta.textContent = metaText;
            card.appendChild(meta);
          }

          if (product.reason) {
            const reason = document.createElement("div");
            reason.className = "product-reason";
            reason.textContent = product.reason;
            card.appendChild(reason);
          }

          if (product.url) {
            const actions = document.createElement("div");
            actions.className = "product-actions";
            const link = document.createElement("a");
            link.href = product.url;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = "Open";
            actions.appendChild(link);
            card.appendChild(actions);
          }

          productGallery.appendChild(card);
        }
      }

      function formatDecisionTrace(steps) {
        if (!steps.length) {
          return "(no decision trace recorded)";
        }
        return steps.map(formatDecisionTraceEvent).join("\n\n");
      }

      function formatToolResults(results) {
        if (!results.length) {
          return "";
        }
        const lines = ["Tool Results"];
        results.forEach((result, index) => {
          const latency = result.latency_ms != null ? ` | latency_ms=${result.latency_ms}` : "";
          lines.push(`[${index + 1}] ${result.tool_name} | success=${result.success}${latency}`);
          if (result.output_ref) {
            lines.push(`    artifact: ${safeDisplayValue(result.output_ref)}`);
          }
          const summary = compactToolResultSummary(result.data || {});
          if (summary) {
            const summaryLines = summary.split("\n");
            lines.push(`    summary: ${summaryLines[0]}`);
            summaryLines.slice(1).forEach((line) => {
              lines.push(`      ${line}`);
            });
          }
          if (result.error) {
            lines.push(`    error: ${result.error}`);
          }
        });
        return lines.join("\n");
      }

      function compactToolResultSummary(data) {
        const productSummary = compactProductResultSummary(data);
        if (productSummary) {
          return productSummary;
        }
        for (const key of ["summary", "response_text", "image_url", "output_ref", "request_id"]) {
          if (data[key]) {
            return String(data[key]).slice(0, 240);
          }
        }
        if (Array.isArray(data.image_urls) && data.image_urls.length) {
          return String(data.image_urls[0]).slice(0, 240);
        }
        if (data.contract && typeof data.contract === "object") {
          return `capability=${data.contract.capability}, status=${data.contract.status}`;
        }
        return "";
      }

      function compactProductResultSummary(data) {
        if (Array.isArray(data.items) && data.items.length) {
          const lines = [];
          data.items.slice(0, 5).forEach((item, index) => {
            if (item && typeof item === "object") {
              lines.push(formatCompactProductItem(item, `${index + 1}`));
            }
          });
          if (lines.length) {
            const header = data.total != null ? `showing ${lines.length} of ${data.total}` : `showing ${lines.length}`;
            return [header, ...lines].join("\n");
          }
        }
        if (data.best_offer && typeof data.best_offer === "object") {
          return formatCompactProductItem(data.best_offer, "best");
        }
        return "";
      }

      function formatCompactProductItem(item, prefix, total) {
        const title = item.title || "candidate";
        const price = item.total_price || item.price;
        const currency = item.currency || "CNY";
        const url = item.product_url || item.url;
        const totalPart = total != null ? ` of ${total}` : "";
        const pricePart = price != null ? `, price=${price} ${currency}` : "";
        const urlPart = url ? `, url=${url}` : "";
        return `${prefix}${totalPart}: ${title}${pricePart}${urlPart}`;
      }

      function formatErrors(errors) {
        if (!errors.length) {
          return "";
        }
        const lines = ["Errors", JSON.stringify(errors, null, 2), "", "Recovery Hints"];
        for (const hint of recoveryHints(errors)) {
          lines.push(`- ${hint}`);
        }
        return lines.join("\n");
      }

      function recoveryHints(errors) {
        const hints = [];
        for (const error of errors) {
          const code = String(error.code || "");
          const message = String(error.message || "").toLowerCase();
          if (code === "PROVIDER_UNCONFIGURED") {
            hints.push("检查 .env 中对应 provider 的 API Key、Base URL 和模型名。");
          } else if (code === "PROVIDER_AUTH_FAILED") {
            hints.push("检查 API Key 是否属于当前 provider，是否有权限，且没有多余引号或空格。");
          } else if (code === "PROVIDER_TIMEOUT") {
            hints.push("真实 Provider 响应超时；可降低生成尺寸、换模型，或稍后重试。");
          } else if (code === "PROVIDER_RATE_LIMITED") {
            hints.push("Provider 限流；等待一段时间或降低请求频率。");
          } else if ((code === "PROVIDER_UNAVAILABLE" || code === "TASK_FAILED") && message.includes("size")) {
            hints.push("检查图像尺寸格式和模型支持的尺寸，例如 DashScope 使用 1024*1024。");
          } else if (code === "TOOL_INPUT_INVALID") {
            hints.push("检查 ReAct action_input 是否缺少工具必需字段。");
          }
        }
        if (!hints.length) {
          hints.push("查看上方 error code/message、tool input 和 trace_id；必要时保存运行日志后复现。");
        }
        return hints;
      }

      function formatDecisionTraceEvent(step) {
        if (step.event === "decision") {
          return [
            `[${step.iteration}] decision: ${step.decision_type}`,
            step.decision_summary ? `decision_summary: ${step.decision_summary}` : null,
            step.action ? `action: ${step.action}` : null,
            step.action_input ? `action_input: ${JSON.stringify(step.action_input)}` : null,
          ].filter(Boolean).join("\n");
        }
        if (step.event === "observation") {
          return [
            `[${step.iteration}] observation: ${step.action}`,
            `success: ${step.success}`,
            step.output_ref ? `output_ref: ${step.output_ref}` : null,
            step.error ? `error: ${JSON.stringify(step.error)}` : null,
            step.recovery_hint ? `recovery_hint: ${step.recovery_hint}` : null,
          ].filter(Boolean).join("\n");
        }
        return [
          `[${step.iteration}] final_answer`,
          step.decision_summary ? `decision_summary: ${step.decision_summary}` : null,
          step.answer ? `answer: ${step.answer}` : null,
        ].filter(Boolean).join("\n");
      }

      function formatRuntimeInfo() {
        if (!runtimeInfo) {
          return "";
        }
        const providers = runtimeInfo.providers || {};
        return [
          `runtime_profile: ${runtimeInfo.runtime_profile}`,
          `graph_mode: ${runtimeInfo.graph_mode}`,
          `assistant_brain: ${providers.chat || "unknown"}`,
          `image_provider: ${providers.image_generation || "unknown"}`,
          `product_search_provider: ${providers.product_search || "unknown"}`,
        ].join("\n");
      }

      function safeDisplayValue(value) {
        const text = String(value);
        const sensitiveParams = ["X-Tos-Credential=", "X-Tos-Signature=", "X-Tos-Algorithm="];
        if (sensitiveParams.some((param) => text.includes(param))) {
          return `${text.split("?", 1)[0]}?[signed-url-redacted]`;
        }
        return text;
      }

      async function fetchJson(url, options) {
        const response = await fetch(url, options);
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(errorMessage(payload.detail || payload.message || `HTTP ${response.status}`));
        }
        return payload;
      }

      function errorMessage(error) {
        if (error && typeof error === "object" && "message" in error) {
          return String(error.message);
        }
        if (error && typeof error === "object") {
          return JSON.stringify(error);
        }
        return String(error || "请求失败。");
      }

      function setStatus(text, isError = false) {
        statusOutput.textContent = text;
        statusOutput.classList.toggle("error", isError);
      }

      function setUserStatus(text, isError = false) {
        userStatus.textContent = text;
        userStatus.classList.toggle("error", isError);
      }

      function initializeTrialUser() {
        const params = new URLSearchParams(window.location.search);
        const fromUrl = normalizeUserId(params.get("user_id"));
        const stored = normalizeUserId(localStorage.getItem(USER_STORAGE_KEY));
        const initial = fromUrl || stored;
        setExperienceEnabled(false);
        if (initial) {
          trialUserIdInput.value = initial;
          void saveTrialUserId();
        } else {
          setUserStatus("请输入你的工号：00xxxx");
        }
      }

      function setExperienceEnabled(enabled) {
        for (const section of accessSections) {
          section.hidden = !enabled;
        }
        sendButton.disabled = !enabled;
        if (!enabled) {
          productsSection.hidden = true;
          artifactsSection.hidden = true;
          setStatus("请先验证工号。");
        }
      }

      function renderExamples(examples) {
        examplesContainer.textContent = "";
        for (const example of examples || []) {
          const button = document.createElement("button");
          button.className = "example";
          button.type = "button";
          button.textContent = example;
          examplesContainer.appendChild(button);
        }
      }

      fetchJson("/demo/runtime-info")
        .then((payload) => {
          runtimeInfo = payload;
        })
        .catch(() => {
          runtimeInfo = null;
        });
      fetchJson("/demo/examples")
        .then((payload) => {
          renderExamples(payload.examples || []);
        })
        .catch(() => {
          renderExamples([]);
        });
      initializeTrialUser();
    </script>
  </body>
</html>
