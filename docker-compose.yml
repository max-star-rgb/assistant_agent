services:
  multimodal-agent:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      MULTIMODAL_AGENT_VISION_PROVIDER: "mock"
      MULTIMODAL_AGENT_CHAT_PROVIDER: "mock"
      MULTIMODAL_AGENT_IMAGE_PROVIDER: "mock"
      MULTIMODAL_AGENT_PRODUCT_PROVIDER: "mock"
      MULTIMODAL_AGENT_PRICE_PROVIDER: "mock"
      MULTIMODAL_AGENT_RENDER_PROVIDER: "mock"
      RUN_INTEGRATION_TESTS: "0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
